name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Test, check, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The CLI and tests are dependency-free, so no install step is needed.
      - run: npm test
      - run: npm run check
      - run: npm run eval
      - run: npm run config:check
      - run: npm run version:check

  build-web-starter:
    name: Build web starter (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: task-manager, prompt: "Build me a todo app" }
          - { name: crm, prompt: "Build me a CRM" }
          - { name: dashboard, prompt: "Build me a SaaS analytics dashboard" }
          - { name: marketplace, prompt: "Build me a marketplace for local services" }
          - { name: notes, prompt: "Build me a notes app" }
          - { name: ecommerce-admin, prompt: "Build me an ecommerce admin to manage products and orders" }
          - { name: landing-page, prompt: "Build me a landing page for my startup" }
          - { name: portfolio, prompt: "Build me a portfolio website to showcase my work" }
          - { name: blog-cms, prompt: "Build me a blog with a CMS editor" }
          - { name: recipe-app, prompt: "Build me a recipe app with ingredient search" }
          - { name: job-board, prompt: "Build me a job board with apply forms" }
          - { name: inventory-manager, prompt: "Build me an inventory manager with low-stock alerts" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate runnable starter
        run: node ./bin/buildable.mjs generate "${{ matrix.prompt }}" --out ./.ci-app --json
      - name: Install starter dependencies
        working-directory: ./.ci-app
        run: npm install --no-fund
      - name: Audit production dependencies
        run: npm run audit:starter -- ./.ci-app
      - name: Typecheck
        working-directory: ./.ci-app
        run: npm run typecheck
      - name: Build
        working-directory: ./.ci-app
        run: npm run build
      - name: Buildable review (structure + guardrails)
        run: node ./bin/buildable.mjs review ./.ci-app

  typecheck-mobile-starter:
    name: Typecheck Expo starter (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: habit-tracker, prompt: "Build me a mobile habit tracker" }
          - { name: booking, prompt: "Build me a mobile booking app for appointments" }
          - { name: task-manager, prompt: "Build me a mobile task manager" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate Expo starter
        run: node ./bin/buildable.mjs generate "${{ matrix.prompt }}" --out ./.ci-mobile --json
      - name: Install starter dependencies
        working-directory: ./.ci-mobile
        run: npm install --no-fund
      - name: Audit production dependencies
        run: npm run audit:starter -- ./.ci-mobile
      # Native build needs an Expo toolchain/simulator; typecheck is the CI-safe gate.
      - name: Typecheck
        working-directory: ./.ci-mobile
        run: npm run typecheck
