name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push --tags`) to cut a
# GitHub release. Distribution is the public repo itself — users install with
# `codex plugin marketplace add suntay44/buildable-plugin-skills`, which is free and
# scales on GitHub's infrastructure. No npm publish, no secrets, no server.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify manifests, config, and tests
        run: |
          npm run version:check
          npm run config:check
          npm test
          npm run check
          npm run eval

      - name: Assert tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
